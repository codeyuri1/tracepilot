name: CI
on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**", "chore/**", "refactor/**", "test/**", "ci/**", "perf/**", "build/**", "revert/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m unittest discover -s demo/runner -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  demo-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic end-to-end demonstration
        run: ./scripts/run-demo-e2e.sh
      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-e2e-report
          path: artifacts/demo/
          if-no-files-found: warn
