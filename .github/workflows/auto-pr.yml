name: Automatic PR
on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
      - 'refactor/**'
      - 'test/**'
      - 'ci/**'
      - 'perf/**'
      - 'build/**'
      - 'revert/**'
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'main';
            const {data: existing} = await github.rest.pulls.list({owner, repo, head: `${owner}:${head}`, base, state: 'open'});
            if (existing.length) {
              core.info(`PR existente: ${existing[0].html_url}`);
              return;
            }
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({owner, repo, basehead: `${base}...${head}`});
            if (!comparison.commits.length) return;
            const title = comparison.commits[0].commit.message.split('\n')[0];
            if (!/^(feat|fix|docs|chore|refactor|test|ci|perf|build|revert)(\([\w./-]+\))?!?: .+/.test(title)) {
              core.setFailed('O primeiro commit deve seguir Conventional Commits.');
              return;
            }
            try {
              const {data: pr} = await github.rest.pulls.create({owner, repo, head, base, title,
                body: '## O que muda\n\nPR criado automaticamente a partir da branch `' + head + '`. Consulte os commits e complete a descrição quando necessário.\n\n## Validação\n\nConsulte os checks de CI associados à branch. O merge permanece explícito.\n\nConsulte CONTRIBUTING.md para as regras de contribuição.'});
              core.info(`PR criado: ${pr.html_url}`);
            } catch (error) {
              if (error.status === 403) core.error('Habilite Settings > Actions > General > Allow GitHub Actions to create and approve pull requests.');
              throw error;
            }
