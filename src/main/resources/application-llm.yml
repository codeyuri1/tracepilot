spring:
  ai:
    model:
      chat: openai
    openai:
      base-url: ${AI_BASE_URL:http://host.docker.internal:11434}
      api-key: ${AI_API_KEY:ollama}
      chat:
        options:
          model: ${AI_MODEL:qwen2.5-coder:7b}
          temperature: 0.1
          max-tokens: 1600
          response-format:
            type: JSON_OBJECT
app:
  analysis:
    model: ${AI_MODEL:qwen2.5-coder:7b}
    timeout: ${AI_TIMEOUT:PT120S}
