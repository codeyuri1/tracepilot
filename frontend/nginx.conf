server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location ^~ /api/ { proxy_read_timeout 180s; proxy_pass http://app:8080; }
  location ^~ /local/ { proxy_pass http://app:8080; }
  location ^~ /swagger-ui/ { proxy_pass http://app:8080; }
  location ^~ /v3/ { proxy_pass http://app:8080; }
  location ~* \.(?:woff2?|js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
